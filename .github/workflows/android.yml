name: 构建 Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      all_sources:
        description: '构建真果鉴（全部站源）；关闭则构建仅红果的红果鉴'
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.4
  GO_VERSION: 1.24.1
  NDK_VERSION: 28.2.13676358
  ALL_SOURCES: ${{ github.event_name == 'push' || inputs.all_sources }}

jobs:
  apk:
    name: arm64-v8a APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Android SDK 36 与 NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 配置发布签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/configure_signing.py

      - name: 构建
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$ALL_SOURCES" = "true" ]; then
            python3 scripts/build_android.py --abi arm64-v8a --all-sources
          else
            python3 scripts/build_android.py --abi arm64-v8a
          fi

      - name: 清理签名材料
        if: always()
        run: python3 scripts/configure_signing.py --clean

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: |
            dist/android/*.apk
            dist/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android/*.apk
            dist/android/SHA256SUMS.txt
          generate_release_notes: true
