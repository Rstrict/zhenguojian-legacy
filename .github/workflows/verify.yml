name: 校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: 构建脚本单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行 scripts/ 单元测试
        working-directory: scripts
        run: python -m unittest discover -p 'test_*.py' -v

  native:
    name: Go 核心
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
      - name: go vet
        working-directory: native
        run: go vet ./...
      - name: go test
        working-directory: native
        run: go test ./...

  flutter:
    name: Flutter 静态检查与单测
    runs-on: ubuntu-latest
    # 本 fork 首次引入 Dart 侧检查，尚未在 CI 上校准过基线；
    # 先按“报告不拦截”运行，等首轮全绿后把这两行删掉即为强制门禁。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test
